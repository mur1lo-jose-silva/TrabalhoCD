# Configuracao estatica do Traefik.
# Em vez de descobrir servicos pelo socket do Docker (que falha no
# Docker Desktop / WSL2), lemos as rotas de um arquivo (dynamic.yml).

entryPoints:
  web:
    address: ":80"

# Usado pelo healthcheck do container (traefik healthcheck --ping).
ping: {}

# Metricas para o Prometheus (em :8080/metrics), por servico de destino.
metrics:
  prometheus:
    addServicesLabels: true
    addRoutersLabels: true

api:
  dashboard: true
  insecure: true

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
