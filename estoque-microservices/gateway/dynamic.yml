# Configuracao dinamica do Traefik: rotas e servicos.
# Cada rota encaminha um prefixo de caminho para o microsservico correto,
# usando o nome do container na rede interna do Docker.

http:
  routers:
    catalogo:
      rule: "PathPrefix(`/produtos`)"
      entryPoints:
        - web
      service: catalogo

    estoque:
      rule: "PathPrefix(`/estoque`)"
      entryPoints:
        - web
      service: estoque

    alertas:
      rule: "PathPrefix(`/alertas`)"
      entryPoints:
        - web
      service: alertas

  services:
    catalogo:
      loadBalancer:
        servers:
          - url: "http://catalogo-service:3000"

    estoque:
      loadBalancer:
        servers:
          - url: "http://estoque-service:8000"

    alertas:
      loadBalancer:
        servers:
          - url: "http://alertas-service:3000"
