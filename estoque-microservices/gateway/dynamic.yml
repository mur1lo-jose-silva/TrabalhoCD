# Configuracao dinamica do Traefik: rotas e servicos.
# Cada rota encaminha um prefixo de caminho para o microsservico correto,
# usando o nome do container na rede interna do Docker.

http:
  routers:
    produtos:
      rule: "PathPrefix(`/produtos`)"
      entryPoints:
        - web
      service: produtos
      priority: 20

    movimentacoes:
      rule: "PathPrefix(`/movimentacoes`)"
      entryPoints:
        - web
      service: movimentacoes
      priority: 20

    # Front end (UI) na raiz. Prioridade baixa para que /produtos e
    # /movimentacoes sempre vencam o roteamento.
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: frontend
      priority: 1

  services:
    produtos:
      loadBalancer:
        servers:
          - url: "http://produtos-service:8000"

    movimentacoes:
      loadBalancer:
        servers:
          - url: "http://movimentacoes-service:3000"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:80"
